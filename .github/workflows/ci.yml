name: SiteKit CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SiteKit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check formatting
        run: npm run format:check
      - name: Build generated outputs
        run: npm run build
      - name: Verify tooling failure paths and generation efficiency
        run: npm run test:tooling
      - name: Lint source contracts
        run: npm run lint
      - name: Validate schemas, semantics, versions, links, and distribution
        run: npm run validate
      - name: Generate component snapshot
        run: npm run snapshot
      - name: Run static distribution smoke
        run: npm run smoke
      - name: Run rendered browser and accessibility matrix
        run: npm run browser:test
      - name: Verify release package and clean consumer
        run: npm run release:check
      - name: Reject generated-output drift
        run: npm run generated:check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sitekit-browser-evidence
          path: artifacts/browser/
          if-no-files-found: warn

  shipcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SiteKit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: site-kit
      - name: Checkout Kujo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kujolang/kujo
          ref: cf785c0a7953717af16b657cda05b85d628144c5
          path: kujo
      - name: Checkout ShipCheck
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kujolang/shipcheck
          ref: 111bfc83c832050877cb9d4fd82908aaf6d14749
          path: shipcheck
      - name: Build Kujo
        run: cargo build --manifest-path kujo/Cargo.toml --release --locked
      - name: Run ShipCheck gate
        working-directory: shipcheck
        run: ../kujo/target/release/kujo run shipcheck.kujo gate --dir ../site-kit --format json

  workcell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SiteKit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: site-kit
          fetch-depth: 0
      - name: Checkout Workcell
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kujolang/workcell
          ref: a276a92c6bac9279a8cb36ace9687ade34d5128f
          path: workcell
      - name: Install released Kujo runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@fc53093f35e4236682bbbf5ab1ccc8d2b4df990c
        with:
          version: v1.6.0
      - name: Pull pinned Node image
        run: docker pull node:20.19.5-bookworm@sha256:ba36e9b2705008e63e354214f0e3011c528af9df2ca13ac2bd2c0114650302e6
      - name: Run and verify contained release proof
        working-directory: site-kit
        env:
          KUJO: ${{ steps.kujo.outputs.kujo-path }}
        run: |
          ../workcell/bin/workcell run --file docs/workcell-launch-gate.json --repo . --no-pull --json > workcell-result.json
          run_dir=$(python3 -c 'import json; print(json.load(open("workcell-result.json"))["output_dir"])')
          ../workcell/bin/workcell verify --run "$run_dir" --json
      - name: Upload Workcell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sitekit-workcell-evidence
          path: |
            site-kit/workcell-result.json
            site-kit/.workcell/runs/
          include-hidden-files: true
          if-no-files-found: warn
