name: SiteKit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm run lint
      - run: npm run validate
      - run: npm run snapshot
      - run: git diff --exit-code -- css/generated DESIGN.md
