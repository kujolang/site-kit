name: Prepare SiteKit release artifact

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Run static release gates
        run: npm run test:static
      - name: Run rendered browser and accessibility matrix
        run: npm run browser:test
      - name: Reject generated-output drift
        run: git diff --exit-code -- css/generated DESIGN.md docs/components.md dist tests/visual/component-snapshot.json
      - name: Build deterministic archive and checksum
        run: npm run release:archive
      - name: Upload inert release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sitekit-${{ github.ref_name }}
          path: |
            artifacts/release/sitekit-*.tar.gz
            artifacts/release/sitekit-*.tar.gz.sha256
          if-no-files-found: error
