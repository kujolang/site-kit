<button class="sk-button" type="button" data-sk-modal-open="{{id}}" aria-controls="{{id}}" aria-haspopup="dialog" aria-expanded="false">Menu</button>
<dialog class="sk-mobile-menu" data-sk-modal id="{{id}}" aria-labelledby="{{id}}-title" tabindex="-1">
  <header class="sk-mobile-menu__header"><h2 id="{{id}}-title">{{title}}</h2><button class="sk-button" type="button" data-sk-modal-close autofocus>Close menu</button></header>
  <nav aria-label="Mobile navigation">{{links}}</nav>
</dialog>
